<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频笔记库</title>
<style>
:root{--bg:#f6f6f3;--fg:#1b1b1d;--muted:#6c6c72;--line:#e3e3dc;--card:#fff;
      --accent:#0e6b4c;--soft:#e8f2ed}
@media (prefers-color-scheme:dark){
  :root{--bg:#121212;--fg:#eaeaea;--muted:#9b9b9b;--line:#2b2b2b;--card:#1a1a1a;
        --accent:#63d3a6;--soft:#182a23}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
  "Hiragino Sans GB","Microsoft YaHei",sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:48px 22px 80px}
header{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:22px}
h1{font-size:1.6em;margin:0 0 8px;letter-spacing:.4px}
.meta{color:var(--muted);font-size:.84em;display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.dot{width:4px;height:4px;border-radius:50%;background:var(--muted);display:inline-block}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0 14px}
input[type=search]{flex:1 1 260px;padding:10px 14px;font:inherit;font-size:.92em;
  border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
button{font:inherit;font-size:.85em;padding:8px 13px;cursor:pointer;border:1px solid var(--line);
  border-radius:999px;background:var(--card);color:var(--muted);transition:.15s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:18px 20px;margin-bottom:14px;transition:.15s}
.card:hover{border-color:var(--accent);box-shadow:0 4px 18px rgba(0,0,0,.06)}
.card .top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--muted);font-size:.78em}
.card .folder{opacity:.75}
.card .dur{background:var(--soft);color:var(--accent);border-radius:6px;padding:1px 8px;font-size:.92em}
.card h2{font-size:1.06em;margin:8px 0 6px;line-height:1.5}
.card h2 a{color:inherit;text-decoration:none}
.card h2 a:hover{color:var(--accent)}
.card .sum{margin:0 0 10px;color:var(--muted);font-size:.9em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.tg{font-size:.75em;color:var(--accent);background:var(--soft);border-radius:6px;padding:2px 8px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.lnk{font-size:.82em;text-decoration:none;color:var(--muted);border:1px solid var(--line);
  border-radius:8px;padding:5px 11px}
.lnk:hover{color:var(--accent);border-color:var(--accent)}
.lnk.main{color:#fff;background:var(--accent);border-color:var(--accent)}
.lnk.main:hover{opacity:.88;color:#fff}
.empty{color:var(--muted);text-align:center;padding:50px 0;display:none}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.78em;line-height:1.8}
@media (max-width:520px){.wrap{padding:30px 16px 60px}.card{padding:15px 16px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>视频笔记库</h1>
    <div class="meta">
      <span>1 篇笔记</span><span class="dot"></span>
      <span>索引更新于 2026-11-06 09:44</span><span class="dot"></span>
      <span>新增文件夹后运行「更新索引.cmd」</span>
    </div>
  </header>

  <div class="toolbar">
    <input id="q" type="search" placeholder="搜索标题、摘要、标签…" autocomplete="off">
    <button id="clear">清空</button>
  </div>
  <div class="chips" id="chips">
      <button class="chip" data-tag="步法">步法</button>
      <button class="chip" data-tag="乒乓球">乒乓球</button>
      <button class="chip" data-tag="身体协调">身体协调</button>
      <button class="chip" data-tag="正手">正手</button>
  </div>

  <main id="list">
    <article class="card" data-tags="乒乓球 正手 步法 身体协调">
      <div class="top"><time>2026-11-06</time><span class="dot"></span><span class="folder">乒乓球&#183;颠腿与身体协调</span><span class="dur">4分19秒</span></div>
      <h2><a href="2026-11-06%20%E4%B9%92%E4%B9%93%E7%90%83%C2%B7%E9%A2%A0%E8%85%BF%E4%B8%8E%E8%BA%AB%E4%BD%93%E5%8D%8F%E8%B0%83/%E6%80%BB%E7%BB%93.html">乒乓正手基础：颠腿与身体协调</a></h2>
      <p class="sum">先练颠腿把身体协调起来，再加重心转换，最后加步法；前脚掌发力、后脚跟不离地、两个脚同时使劲。</p>
      <div class="tags"><span class="tg">#乒乓球</span><span class="tg">#正手</span><span class="tg">#步法</span><span class="tg">#身体协调</span></div>
      <div class="links"><a class="lnk main" href="2026-11-06%20%E4%B9%92%E4%B9%93%E7%90%83%C2%B7%E9%A2%A0%E8%85%BF%E4%B8%8E%E8%BA%AB%E4%BD%93%E5%8D%8F%E8%B0%83/%E6%80%BB%E7%BB%93.html">打开</a><a class="lnk" href="2026-11-06%20%E4%B9%92%E4%B9%93%E7%90%83%C2%B7%E9%A2%A0%E8%85%BF%E4%B8%8E%E8%BA%AB%E4%BD%93%E5%8D%8F%E8%B0%83/%E9%80%90%E5%8F%A5%E6%96%87%E7%A8%BF.html">逐句文稿</a><a class="lnk" href="2026-11-06%20%E4%B9%92%E4%B9%93%E7%90%83%C2%B7%E9%A2%A0%E8%85%BF%E4%B8%8E%E8%BA%AB%E4%BD%93%E5%8D%8F%E8%B0%83/%E8%BD%AC%E5%86%99%E7%A8%BF.srt">转写稿.srt</a><a class="lnk" href="2026-11-06%20%E4%B9%92%E4%B9%93%E7%90%83%C2%B7%E9%A2%A0%E8%85%BF%E4%B8%8E%E8%BA%AB%E4%BD%93%E5%8D%8F%E8%B0%83/%E8%BD%AC%E5%86%99%E7%A8%BF.txt">转写稿.txt</a></div>
    </article>
  </main>
  <div class="empty" id="empty">没有匹配的笔记</div>

  <footer>
    <div>目录结构：每篇一个文件夹，内含 总结.html / 逐句文稿.html / 转写稿.txt / meta.json。</div>
    <div>meta.json 可手写标题、日期、标签、摘要，索引会读取它。</div>
  </footer>
</div>

<script>
(function () {
  var q = document.getElementById('q'),
      cards = Array.prototype.slice.call(document.querySelectorAll('.card')),
      chips = Array.prototype.slice.call(document.querySelectorAll('.chip')),
      empty = document.getElementById('empty'),
      active = '';

  function apply() {
    var kw = q.value.trim().toLowerCase();
    var shown = 0;
    cards.forEach(function (c) {
      var txt = c.textContent.toLowerCase();
      var okKw = !kw || txt.indexOf(kw) !== -1;
      var okTag = !active || (c.dataset.tags || '').split(' ').indexOf(active) !== -1;
      var ok = okKw && okTag;
      c.style.display = ok ? '' : 'none';
      if (ok) shown++;
    });
    empty.style.display = shown ? 'none' : 'block';
  }

  q.addEventListener('input', apply);
  document.getElementById('clear').addEventListener('click', function () {
    q.value = ''; active = '';
    chips.forEach(function (c) { c.classList.remove('on'); });
    apply(); q.focus();
  });
  chips.forEach(function (c) {
    c.addEventListener('click', function () {
      var t = c.dataset.tag;
      active = (active === t) ? '' : t;
      chips.forEach(function (x) { x.classList.toggle('on', x.dataset.tag === active); });
      apply();
    });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
})();
</script>
</body>
</html>
